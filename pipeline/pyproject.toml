[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tw-qvm-pipeline"
version = "1.0.0"
description = "Serverless GitHub Actions Data Pipeline for TW-QVM Quant Terminal"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "tenacity>=8.3.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "respx>=0.21.1",
]

[tool.setuptools]
packages = ["calculators", "providers"]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
